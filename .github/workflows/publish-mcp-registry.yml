name: Publish to MCP Registry

on:
  push:
    tags:
      - "v*"
  # Lets you backfill a version the registry missed without cutting a new tag.
  workflow_dispatch:

# Separate workflow (not a release.yml job) because release.yml is generated by
# cargo-dist and gets clobbered on regeneration -- same reason publish-crates.yml
# stands alone.

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Publish
        env:
          # Reverse-DNS namespace (tech.kasabeh/*) can't use GitHub OIDC -- it needs
          # the key whose public half is in the kasabeh.tech TXT record.
          DNS_KEY: ${{ secrets.MCP_REGISTRY_DNS_KEY }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./server.json').version")

          published=$(curl -sf "https://registry.modelcontextprotocol.io/v0/servers?search=tech.kasabeh/baton" \
            | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).servers.map(s=>s.server.version).join("\n")')
          if grep -qxF "$version" <<<"$published"; then
            echo "tech.kasabeh/baton $version already in the registry, skipping"
            exit 0
          fi

          # The registry verifies ownership by reading mcpName out of the published
          # npm package, so it has to exist there first. release.yml publishes npm
          # in parallel with this workflow -- wait for it rather than racing.
          for _ in $(seq 60); do
            if curl -sfo /dev/null "https://registry.npmjs.org/@kasabeh/baton-mcp/$version"; then
              break
            fi
            echo "waiting for @kasabeh/baton-mcp@$version on npm..."
            sleep 10
          done
          curl -sfo /dev/null "https://registry.npmjs.org/@kasabeh/baton-mcp/$version"

          mcp-publisher login dns --domain kasabeh.tech --private-key "$DNS_KEY"
          mcp-publisher publish
